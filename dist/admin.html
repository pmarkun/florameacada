<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Moderação de cartas · Cartas à Flora</title>
<link rel="icon" href="/icone-192.png">
<link rel="stylesheet" href="/guia.css?v=cartas-a-flora-3">
<link rel="stylesheet" href="/admin.css?v=magic-1">
<script src="/admin.js?v=magic-1" defer></script>
</head>
<body>
<a class="skip" href="#conteudo">Ir ao conteúdo</a>
<header class="mast">
  <a class="brand" href="/"><img src="/icone-192.png" alt="" width="44" height="44">Cartas à Flora</a>
  <nav><button id="logout" class="button outline" type="button" hidden>Sair</button></nav>
</header>
<main id="conteudo">
  <section class="paper prose" aria-labelledby="titulo">
    <h1 id="titulo">Moderação de cartas</h1>
    <p id="notice" role="status">Carregando…</p>
    <div id="login" hidden>
      <p>Use seu endereço autorizado para receber um link de acesso de uso único.</p>
      <form id="login-form" class="claim-form">
        <label for="email">Seu e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button class="button ink-button" type="submit">Enviar link de acesso</button>
      </form>
    </div>
    <div id="redeem" hidden>
      <button class="button ink-button" type="button" id="redeem-button">Entrar no painel</button>
    </div>
    <details id="admin-access" hidden>
      <summary>Administradores</summary>
      <ul id="admin-list"></ul>
      <form id="admin-form" class="claim-form">
        <label for="admin-email">E-mail do novo administrador</label>
        <input id="admin-email" name="email" type="email" autocomplete="off" maxlength="254" required>
        <p class="form-note">A pessoa poderá solicitar um link nessa página e moderar cartas.</p>
        <button class="button ink-button" type="submit">Adicionar administrador</button>
        <p id="admin-status" role="status"></p>
      </form>
    </details>
    <section id="queue" aria-label="Fila de cartas" hidden>
      <div class="admin-actions" role="group" aria-label="Filtrar cartas">
        <button class="button outline" id="pending" type="button" aria-pressed="true">Pendentes</button>
        <button class="button outline" id="published" type="button" aria-pressed="false">Publicadas</button>
      </div>
      <div id="letters"></div>
      <div class="admin-actions" id="pagination" hidden>
        <button class="button outline" id="previous" type="button">Página anterior</button>
        <button class="button outline" id="next" type="button">Próxima página</button>
      </div>
    </section>
    <template id="letter-card">
      <article class="admin-letter">
        <h2><a class="plant"></a></h2>
        <p class="letter-meta muted"><span class="submitted-email"></span> · <time></time></p>
        <form class="claim-form">
          <label>Nome do autor<input name="name" maxlength="100" required></label>
          <label>Carta<textarea name="letter" rows="9" maxlength="8000" required></textarea></label>
          <div class="admin-actions">
            <button class="button outline" type="submit" value="edit">Salvar edição</button>
            <button class="button ink-button" type="submit" value="publish">Aprovar e publicar</button>
            <button class="button outline delete-letter" type="button">Excluir</button>
          </div>
          <p role="status" class="claim-status"></p>
        </form>
      </article>
    </template>
  </section>
</main>
</body>
</html>
