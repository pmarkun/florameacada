<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f1e9d6">
<title>Caderno · Cartas à Flora</title>
<link rel="icon" href="/icone-192.png">
<link rel="stylesheet" href="/caderno.css?v=1">
<script src="/prazo.js?v=1" defer></script>
<script src="/caderno.js?v=2" defer></script>
</head>
<body>
<main>
  <div class="desk-nav"><a href="/" id="back">← Cartas à Flora</a></div>
  <article class="notebook">
    <header>
      <p class="recipient">Uma carta para</p>
      <h1 id="plant">Seu caderno</h1>
      <time id="deadline" class="hint" hidden></time>
    </header>
    <p id="notice" role="status">Abrindo o caderno…</p>
    <form id="write" hidden>
      <label for="letter" class="sr-only">Sua carta</label>
      <textarea id="letter" maxlength="8000" placeholder="Comece aqui…" autocomplete="off" spellcheck="true"></textarea>
      <footer>
        <label for="author">Como você quer assinar?</label>
        <input id="author" maxlength="100" autocomplete="name" placeholder="Seu nome">
        <div class="actions">
          <button type="button" id="save">Salvar rascunho</button>
          <button type="submit" id="submit">Enviar para publicação</button>
        </div>
        <p class="hint" id="hint">A carta passa por revisão antes de aparecer no guia.</p>
        <p id="writing-status" role="status"></p>
      </footer>
    </form>
  </article>
</main>
</body>
</html>
